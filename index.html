<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo loco</title>

    <link rel="stylesheet" href="style.css">

    <script src="/models/drawable-object.class.js"></script>
    <script src="/models/moveAble-object.class.js"></script>
    <script src="/models/character.class.js"></script>
    <script src="/models/chicken.class.js"></script>
    <script src="/models/chicken-small.class.js"></script>
    <script src="/models/cloud.class.js"></script>
    <script src="/models/status-bar.class.js"></script>
    <script src="/models/status-bar-bottle.class.js"></script>
    <script src="/models/status-bar-endboss.class.js"></script>
    <script src="/models/status-bar-coin.class.js"></script>
    <script src="/models/world.class.js"></script>
    <script src="/models/background-object.class.js"></script>
    <script src="/models/keyboard.class.js"></script>
    <script src="/models/collectable-object-coin.class.js"></script>
    <script src="/models/collectable-object.class.js"></script>
    <script src="/models/level.class.js"></script>
    <script src="/models/throwable-object.class.js"></script>
    <script src="/models/endboss.class.js"></script>
    <script src="/level/level1.js"></script>
    <script src="/js/game.js"></script>



</head>

<body onload="init()">

    <h1>El Pollo Loco</h1>

    <div id="start-screen">
        <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="Startscreen" id="startscreen-image">
        <button onclick="startGame()">Start</button>
    </div>
    <p style="color: whitesmoke">Arrow to move, D to through bottles, Space for jumping</p>

    <button id="restart-btn" onclick="restartGame()" style="display: none;">
        Zurück zum Start
    </button>

    <div id="win-screen"
        style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.7); flex-direction: column;">
        <div style="text-align: center;">
            <img src="img/You won, you lost/youwin.png" style="max-width: 80vw; max-height: 50vh;">
            <div style="margin-top: 20px;">
                <button onclick="location.reload()"
                    style="padding: 10px 20px; font-size: 1.2em; cursor: pointer; margin: 0 10px;">Spiel neu
                    starten</button>
                <button onclick="location.reload()"
                    style="padding: 10px 20px; font-size: 1.2em; cursor: pointer; margin: 0 10px;">Zurück zum
                    Startbildschirm</button>
            </div>
        </div>
    </div>

    <div id="lose-screen"
        style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; justify-content: center; align-items: center; background-color: rgba(0, 0, 0, 0.7); flex-direction: column;">
        <div style="text-align: center;">
            <img src="img/You won, you lost/gameover.png" style="max-width: 80vw; max-height: 50vh;">
            <div style="margin-top: 20px;">
                <button onclick="location.reload()"
                    style="padding: 10px 20px; font-size: 1.2em; cursor: pointer; margin: 0 10px;">Spiel neu
                    starten</button>
                <button onclick="location.reload()"
                    style="padding: 10px 20px; font-size: 1.2em; cursor: pointer; margin: 0 10px;">Zurück zum
                    Startbildschirm</button>
            </div>
        </div>
    </div>

    <canvas id="canvas" width="720" height="400" style="display: none">

    </canvas>

</body>

</html>
