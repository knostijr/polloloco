<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El pollo loco</title>

    <link rel="stylesheet" href="style.css">
    <script src="/models/soundmanager.class.js"></script>
    <script src="/models/drawable-object.class.js"></script>
    <script src="/models/moveAble-object.class.js"></script>
    <script src="/models/character.class.js"></script>
    <script src="/models/chicken.class.js"></script>
    <script src="/models/chicken-small.class.js"></script>
    <script src="/models/cloud.class.js"></script>
    <script src="/models/status-bar.class.js"></script>
    <script src="/models/status-bar-bottle.class.js"></script>
    <script src="/models/status-bar-endboss.class.js"></script>
    <script src="/models/status-bar-coin.class.js"></script>
    <script src="/models/keyboard.class.js"></script>
    <script src="/models/mobile.keyboard.class.js"></script>
    <script src="/models/collectable-object-coin.class.js"></script>
    <script src="/models/collectable-object.class.js"></script>
    <script src="/models/level.class.js"></script>
    <script src="/models/throwable-object.class.js"></script>
    <script src="/models/endboss.class.js"></script>
    <script src="/models/background-object.class.js"></script>
    <script src="/level/level1.js"></script>
    <script src="/models/world.class.js"></script>
    <script src="/js/game.js"></script>



</head>

<body>
    <div id="main-wrapper">
        <h1 class="main-title">El Pollo Loco</h1>
        <p>Arrow to move, D to through bottles, Space for jumping</p>

        <div id="game-container">
            <div id="start-screen" class="game-view">
                <img src="img/9_intro_outro_screens/start/startscreen_1.png" alt="Startscreen" id="startscreen-image">
                <button onclick="startGame()">Start</button>
            </div>
            <canvas id="canvas" width="720" height="400" class="game-view"></canvas>
            
            <div id="win-screen" class="game-overlay">
                <div class="overlay-content">
                    <img src="img/You won, you lost/youwin.png">
                    <div class="overlay-buttons">
                        <button onclick="restartGame()">Spiel neu starten</button>
                        <button onclick="location.reload()">Zurück zum Startbildschirm</button>
                    </div>
                </div>
            </div>
            <div id="lose-screen" class="game-overlay">
                <div class="overlay-content">
                    <img src="img/You won, you lost/gameover.png">
                    <div class="overlay-buttons">
                        <button onclick="restartGame()">Spiel neu starten</button>
                        <button onclick="location.reload()">Zurück zum Startbildschirm</button>
                    </div>
                </div>
            </div>

            <img id="mute-button" src="img/mute.png" alt="Mute Button">
            <img id="pause-button" src="img/pause.png" alt="Pause Button">
        </div>

        <div id="touch-controls">
            <button id="left-button">⬅️</button>
            <button id="right-button">➡️</button>
            <button id="jump-button">⬆️</button>
            <button id="throw-button">🎯</button>
        </div>
    </div>
</body>

</html>
